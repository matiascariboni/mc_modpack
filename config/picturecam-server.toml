[camera]
	#The time in milliseconds the camera will be on cooldown after taking an image
	# Default: 0
	# Range: > 0
	cooldown = 0

	[camera.consumed_item]
		#The amount of the item that is consumed when taking an image
		# Default: 1
		# Range: 1 ~ 32767
		amount = 1

[image]
	#The maximum size of an image in bytes when transferred to the server
	#Higher values mean more delay/lag between taking an image and getting it into your inventory
	# Default: 200000
	# Range: 50000 ~ 1000000
	max_size = 200000
	#The amount of jpeg compression applied to the image
	#If the image exceeds the 'max_image_size', it will get compressed anyways
	# Default: 0.5
	# Range: 0.1 ~ 1.0
	compression = 0.5
	#If it is allowed to upload custom images
	allow_upload = true
	#If it is allowed to upload images from URLs
	allow_url = true
	#If only HTTPS URLs are allowed
	url_https_only = true
	#Maximum download size for URL images in bytes
	# Default: 2000000
	# Range: 50000 ~ 10000000
	url_max_download_size = 2000000
	#Timeout for URL image downloads in milliseconds
	# Default: 10000
	# Range: 1000 ~ 60000
	url_timeout_ms = 10000
	#List of allowed domains for URL images (empty = all allowed)
	url_allowed_domains = []

[image_frame]
	#If only the owner can modify or break the image frame
	only_owner_modify = false

[advanced_data]
	#If the image items should store additional data
	#This isn't used by the mod itself
	#Only enable this if you know what you are doing
	enable = false
	#The amount of entities that should be stored
	# Default: 16
	# Range: 1 ~ 128
	max_entities = 16

[album]
	#If newly taken photos should be automatically stored in an album if the player has one
	auto_store = true
